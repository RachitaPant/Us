<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bhagirathi 101 SQUAD 💖</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .clip {
      @apply absolute top-0 left-1/2 -translate-x-1/2 -translate-y-3;
    }

    /* Floating heart */
    .heart {
      position: fixed;
      color: #ff69b4;
      font-size: 24px;
      animation: float 5s linear infinite;
      pointer-events: none;
      opacity: 0.7;
      z-index: 0;
    }
    @keyframes float {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-100vh) scale(1.5); opacity: 0; }
    }

    /* Auto-scrolling timeline */
    .scroll-wrapper {
      overflow-x: hidden;
      white-space: nowrap;
      position: relative;
    }
    .scroll-track {
      display: inline-block;
      white-space: nowrap;
      animation: scroll-left 30s linear infinite;
    }
    @keyframes scroll-left {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
  </style>
</head>
<body class="bg-gradient-to-br from-white to-pink-50 min-h-screen overflow-y-auto relative">

<!-- Floating hearts -->
<script>
  document.addEventListener("DOMContentLoaded", () => {
    setInterval(() => {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerText = "💖";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = 3 + Math.random() * 2 + "s";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 5000);
    }, 400);
  });
</script>

<div class="relative z-10 p-4 sm:p-6">

  <!-- Title -->
  <h1 class="text-4xl text-center font-bold mb-8">Bhagirathi 101 Yearbook 📘</h1>

  <!-- Introduce Roommates -->
  <h2 class="text-2xl font-semibold text-center mb-6">Meet the Roommates 💫</h2>
  <div class="grid grid-cols-2 sm:grid-cols-3 gap-6 justify-items-center">
    <!-- Each roommate card -->
    <div class="bg-white rounded-xl shadow-md p-4 w-40 text-center rotate-[-2deg]">
      <img src="assets/images/asmi.jpg" />
      <p class="font-medium">Asmi</p>
    </div>
    <div class="bg-white rounded-xl shadow-md p-4 w-40 text-center rotate-[1deg]">
      <img src="assets/images/bhumika.jpg" class="rounded-full mx-auto mb-2" />
      <p class="font-medium">Bhumika</p>
    </div>
    <div class="bg-white rounded-xl shadow-md p-4 w-40 text-center rotate-[-1deg]">
      <img src="assets/images/kusheen.png" class="rounded-full mx-auto mb-2" />
      <p class="font-medium">Kusheen</p>
    </div>
    <div class="bg-white rounded-xl shadow-md p-4 w-40 text-center rotate-[2deg]">
      <img src="assets/images/rachita.jpg" class="rounded-full mx-auto mb-2" />
      <p class="font-medium">Rachita</p>
    </div>
    <div class="bg-white rounded-xl shadow-md p-4 w-40 text-center rotate-[-3deg]">
      <img src="assets/images/iqra.jpg" class="rounded-full mx-auto mb-2" />
      <p class="font-medium">Iqra</p>
    </div>
    <div class="bg-white rounded-xl shadow-md p-4 w-40 text-center rotate-[-3deg]">
      <img src="assets/images/janki.jpg" class="rounded-full mx-auto mb-2" />
      <p class="font-medium">Andd Janki cause why not </p>
    </div>
  </div>
  

  <p class="text-center mt-10 text-gray-500 italic text-sm">
    Forever Bhagirathi 101 — Love, Laughter and Late Night Maggie 🌙🍜
  </p>

</div>
</body>
</html>
